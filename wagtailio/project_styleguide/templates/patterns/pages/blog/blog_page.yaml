tags:
  pageurl:
    page.get_parent as blog_index_url:
      raw: '#'
  image:
    author.image fill-40x40 class="logo-card__image":
      raw: |
        <img src="https://placehold.co/40x40" alt="Some alt" class="logo-card__image">
    value.logo fill-40x40 class="logo-card__image":
      raw: |
        <img src="https://placehold.co/40x40" alt="Some alt" class="logo-card__image">
    page.main_image min-1200x630 as social_img:
      target_var: social_img
      raw: https://placehold.co/1200x630
    page.main_image width-900 class="blog__main-image":
      raw: |
        <img src="https://placehold.co/900x600" alt="Some alt" class="blog__main-image">
  include_block:
    page.body:
      template_name: 'patterns/_pattern_library_only/blog_page_example.html'
