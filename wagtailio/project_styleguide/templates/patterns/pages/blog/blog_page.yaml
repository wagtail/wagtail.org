    meta_text: Adventures in Wagtail
    publication_date: !!timestamp '2022-08-12'
    related_pages:
      - page:
          specific:
            title: Preparations for Wagtail Space NL are in full swing
            introduction: The preparations for Wagtail Space NL are going great. I want to inform you about the latest developments.
            meta_icon: arrows
            meta_text: Community
            logo: fake
            link_url: '#'
            authors:
              all:
                - author:
                    image: true
                    name: John Smith
      - page:
          specific:
            title: How to try Wagtail CMS without coding
            introduction: How to setup Wagtail and explore the content management system without any coding.
            meta_icon: location-pin
            meta_text: Resources
            logo: fake
            link_url: '#'
            authors:
              all:
                - author:
                    image: true
                    name: John Smith
