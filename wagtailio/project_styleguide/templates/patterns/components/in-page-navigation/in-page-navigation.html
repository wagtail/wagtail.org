{% if items %}
    <div class="grid">
        <nav class="in-page-navigation" aria-labelledby="in-page-navigation-heading">
            <h2 class="in-page-navigation__heading heading-three" id="in-page-navigation-heading">On this page</h2>

            <ul class="in-page-navigation__list">
                {% for item in items %}
                    <li class="in-page-navigation__item">
                        <a class="in-page-navigation__link{% if item.children %} in-page-navigation__link--parent{% endif %}" href="#{{ item.id }}">
                            <svg class="in-page-navigation__icon" aria-hidden="true"><use xlink:href="#arrow"></use></svg>
                            {{ item.text }}
                        </a>
                        {% if item.children %}
                            <ul class="in-page-navigation__list in-page-navigation__list--nested">
                                {% for child in item.children %}
                                    <li class="in-page-navigation__item">
                                        <a class="in-page-navigation__link" href="#{{ child.id }}">{{ child.text }}</a>
                                    </li>
                                {% endfor %}
                            </ul>
                        {% endif %}
                    </li>
                {% endfor %}
            </ul>
        </nav>
    </div>
{% endif %}
