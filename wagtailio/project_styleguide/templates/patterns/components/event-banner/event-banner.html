<div class="event-banner {{ theme_class }}">
    <div class="event-banner__inner container">
        <div class="event-banner__content">
            {% if intro_text %}
                <p class="event-banner__intro">{{ intro_text }}</p>
            {% endif %}

            <div class="event-banner__details">
                {% if illustration_url %}
                    <img class="event-banner__illustration" src="{{ illustration_url }}" alt="" aria-hidden="true">
                {% endif %}

                <div class="event-banner__text">
                    <p class="event-banner__title">{{ title }}</p>
                    {% if date_text %}
                        <span class="event-banner__divider" aria-hidden="true"></span>
                        <p class="event-banner__date">{{ date_text }}</p>
                    {% endif %}
                </div>
            </div>
        </div>

        {% if cta_url and cta_text %}
            <a class="event-banner__cta" href="{{ cta_url }}">
                <span class="event-banner__cta-text">{{ cta_text }}</span>
                <svg class="event-banner__cta-arrow" aria-hidden="true" focusable="false">
                    <use xlink:href="#arrow"></use>
                </svg>
            </a>
        {% endif %}
    </div>
</div>
