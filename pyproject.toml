[tool.poetry]
name = "wagtail-org"
version = "2.3.0"
description = "The wagtail.org Wagtail site"
authors = ["Torchbox <hello@torchbox.com>"]
license = "BSD-3-Clause"
readme = "README.md"
packages = [{include = "wagtailio"}]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
python = "^3.15"
django = "~6.1.3"
wagtail = "~8.1.0"
psycopg = "~3.3"
gunicorn = "~26.2.0"
dj-database-url = "~3.1.2"
django-basic-auth-ip-whitelist = "~0.8"
django-manifest-loader = "~1.0.0"
django-pattern-library = "~1.6.0"
django-permissions-policy = "~4.34"
django-storages = { version ="~1.14", extras = ["s3"] }
markdown = "~3.11"
pygments = "~2.21"
requests = "~2.34.2"
scout-apm = "~4.1"
sentry-sdk = "~2.74"
wagtail-font-awesome-svg = "~2.0"

wagtailmedia = "~0.19.1"
whitenoise = "~6.12"
django-redis = "~7.0"
tzdata = "^2026.6"
wagtail-schema-org = "~5.0"

[tool.poetry.group.dev.dependencies]
pre-commit = "4.7.0"
djhtml = "3.0.11"
ruff = "0.17.4"  # keep in sync with .pre-commit-config.yaml
